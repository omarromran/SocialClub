<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>const storedTheme = localStorage.getItem('socialclub-theme'); document.documentElement.dataset.theme = ['light', 'dark', 'ocean', 'forest-crimson', 'lemon-charcoal', 'mocha-gold', 'ice-aubergine', 'platinum-mocha', 'oatmeal-pine'].includes(storedTheme) ? storedTheme : 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css">
  <title>Sign up · The Social Club</title>
</head>
<body>
  <main class="auth-shell"><section class="auth-card" aria-labelledby="page-title">
    <div class="auth-header"><a class="wordmark" href="/">The Social Club</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">◐</button></div>
    <h1 id="page-title">Create account</h1>
    <form class="auth-form" id="signup-form">
      <label class="field">Email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Username<input id="username" name="username" autocomplete="username" required minlength="3"></label>
      <small class="validation" id="username-message" aria-live="polite"></small>
      <label class="field">Password<input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
      <label class="field">Confirm password<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8"></label>
      <p class="message" role="alert"></p><button class="btn" type="submit">Sign up</button>
    </form>
    <p class="helper">Already registered? <a href="/login">Log in</a></p>
  </section></main>
  <script src="theme.js"></script><script src="signup.js"></script>
</body>
</html>
