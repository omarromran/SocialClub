<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>const theme = localStorage.getItem('socialclub-theme'); if (theme) document.documentElement.dataset.theme = theme;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/layout.css">
  <title>Home · The Social Club</title>
</head>
<body>
  <div class="app-shell">
    <!-- SHARED_NAV -->
    <main class="app-main"><div class="app-main__content">
      <section class="account-panel" aria-labelledby="page-title">
        <div class="auth-header">
          <h1 id="page-title">The Social Club</h1>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">◐</button>
        </div>
        <div class="account-copy">
          <p id="welcome" aria-live="polite">Loading account...</p>
          <button class="btn" id="logout" type="button">Log out</button>
        </div>
      </section>
    </div>
  </main>
  </div>
  <script src="theme.js"></script>
  <script src="index.js"></script>
</body>
</html>
