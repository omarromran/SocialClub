<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>const theme = localStorage.getItem('socialclub-theme'); if (theme) document.documentElement.dataset.theme = theme;</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <title>Profile · The Social Club</title>
</head>
<body>
    <div class="app-shell">
        <!-- SHARED_NAV -->
        <main class="app-main">
            <div class="app-main__content">
                <section class="profile-panel" aria-labelledby="page-title">
                    <div class="profile-actions">
                        <a class="btn btn--outline" href="/settings">Settings</a>
                        <a class="btn" href="/edit-profile">Edit profile</a>
                    </div>
                    <h1 class="page-panel__title" id="page-title">Profile</h1>
                    <div class="profile-avatar" id="profile-avatar" aria-label="Profile picture">?</div>
                    <p class="profile-handle" id="profile-user">Loading profile...</p>
                    <p class="page-panel__text" id="profile-bio">Loading bio...</p>
                    <div class="profile-stats" aria-label="Profile statistics">
                        <span><strong id="post-count">0</strong> posts</span>
                        <button class="profile-stat" id="followers-button" type="button"><strong id="follower-count">0</strong> followers</button>
                        <button class="profile-stat" id="following-button" type="button"><strong id="following-count">0</strong> following</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <div class="profile-modal" id="profile-modal" hidden>
        <div class="profile-modal__backdrop" data-modal-close></div>
        <section class="profile-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
            <div class="profile-modal__header">
                <h2 id="profile-modal-title">Followers</h2>
                <button class="profile-modal__close" type="button" aria-label="Close" data-modal-close>×</button>
            </div>
            <p class="profile-modal__status" id="profile-modal-status"></p>
            <ul class="profile-modal__list" id="profile-modal-list"></ul>
        </section>
    </div>
    <script src="theme.js"></script>
    <script src="profile.js"></script>
</body>
</html>
